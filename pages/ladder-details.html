<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ladder Details</title>
    <link rel="stylesheet" href="../css/tennis.css" />
  </head>
  <body class="ladder-details">
    <main class="layout">
      <header class="page-header">
        <h1>City Ladder</h1>
        <p class="page-subtitle">Stay connected with the players competing in this ladder.</p>
      </header>

      <section class="card ladder-card">
        <header class="ladder-card__header">
          <div class="ladder-card__title">
            <h2>Summer Singles</h2>
            <p class="ladder-card__subtitle">Updated 5 minutes ago</p>
          </div>
          <div class="header-actions" role="group" aria-label="Ladder actions">
            <button class="btn ghost" type="button">Share</button>
            <button class="btn ghost" type="button">Settings</button>
            <button class="btn danger" type="button">Leave</button>
          </div>
        </header>

        <dl class="ladder-meta">
          <div>
            <dt>Visibility</dt>
            <dd>Public ladder</dd>
          </div>
          <div>
            <dt>Members</dt>
            <dd>42 players</dd>
          </div>
          <div>
            <dt>Matches played</dt>
            <dd>128</dd>
          </div>
          <div>
            <dt>Location</dt>
            <dd>Ljubljana, Slovenia</dd>
          </div>
        </dl>
      </section>
    </main>
  </body>
</html>
